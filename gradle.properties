# NOTE: machine-local JDK pins (org.gradle.java.home) belong in ~/.gradle/gradle.properties —
# this file must stay portable. SDK setup: JDK 17-21; newer JDKs (26+) break AGP's jlink transform.

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2048m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
